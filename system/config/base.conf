# MyLinux base system configuration
#
# Templates installed by the MyLinux installer into the target system. These
# are rendered / copied verbatim by installer/backend/install_base.sh so that
# reusable defaults live in the repository rather than in the script.

# --- /etc/hostname -----------------------------------------------------
# Written by the installer with the user's chosen hostname.

# --- /etc/locale.conf --------------------------------------------------
LANG=en_US.UTF-8
LC_MESSAGES=en_US.UTF-8
LC_TIME=en_US.UTF-8

# --- /etc/vconsole.conf ------------------------------------------------
KEYMAP=us
FONT=ter-124b

# --- /etc/timezone -----------------------------------------------------
# Written by the installer (e.g. Asia/Tehran) and linked to /etc/localtime.

# --- /etc/pacman.conf additions ---------------------------------------
# [multilib] and [extra] are enabled; see packages/ for what gets installed.
