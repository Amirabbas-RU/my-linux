# MyLinux /etc/mkinitcpio.conf
#
# A conservative, UEFI-friendly initramfs configuration. Includes the hooks
# needed for LUKS, LVM, btrfs and the standard ext4/xfs root on a VM or bare
# metal.

MODULES=()

BINARIES=()

FILES=()

HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
