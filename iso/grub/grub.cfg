# MyLinux live medium — GRUB configuration.
#
# Boots the squashfs live environment. Mirrors the systemd-boot entries in
# efiboot/loader/entries so UEFI and BIOS machines present the same experience.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod exfat
insmod udf

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

if [ "${grub_platform}" == 'efi' ]; then
    mylinux_platform='UEFI'
else
    mylinux_platform='BIOS'
fi

default=mylinux
timeout=15
timeout_style=menu

menuentry "MyLinux live/installation medium (x86_64, ${mylinux_platform})" --class mylinux --class gnu-linux --class os --id 'mylinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "MyLinux live medium with speakup screen reader" --hotkey s --class mylinux --class gnu-linux --class os --id 'mylinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System reboot' --class reboot {
    reboot
}

menuentry 'System shutdown' --class shutdown {
    halt
}
