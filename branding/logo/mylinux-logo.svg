<?xml version="1.0" encoding="UTF-8"?>
<!-- MyLinux logo: an abstract sunrise over a terminal horizon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MyLinux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1a2b"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc35c"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- rising sun -->
  <circle cx="128" cy="150" r="62" fill="url(#sun)"/>

  <!-- horizon line masks the lower half of the sun -->
  <rect x="34" y="150" width="188" height="10" rx="5" fill="#0d0b14"/>

  <!-- terminal caret -->
  <rect x="112" y="108" width="34" height="12" rx="4" fill="#7c6cf0" opacity="0.95"/>
</svg>
