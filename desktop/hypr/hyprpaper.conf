# MyLinux Hyprpaper wallpaper daemon
#
# Preloads the MyLinux default wallpaper and applies it to all monitors.
# The MyLinux installer copies the installed user's chosen wallpaper to
# /usr/share/mylinux/wallpapers/mylinux-default.png.
#
# hyprpaper 0.8 reworked its configuration: `wallpaper` is a block whose
# `monitor` key selects the output (empty = every monitor) and whose `path`
# key names the image. The legacy `wallpaper = monitor,path` form parses but
# matches nothing, so the desktop would come up without a wallpaper.

splash = false

ipc = on

preload = /usr/share/mylinux/wallpapers/mylinux-default.png

wallpaper {
    monitor =
    path = /usr/share/mylinux/wallpapers/mylinux-default.png
}