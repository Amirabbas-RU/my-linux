# MyLinux Hyprpaper wallpaper daemon
#
# Preloads the MyLinux default wallpaper and applies it to all monitors.
# The MyLinux installer copies the installed user's chosen wallpaper to
# /usr/share/mylinux/wallpapers/mylinux-default.png.

preload = /usr/share/mylinux/wallpapers/mylinux-default.png

wallpaper = , /usr/share/mylinux/wallpapers/mylinux-default.png

splash = false

ipc = on
