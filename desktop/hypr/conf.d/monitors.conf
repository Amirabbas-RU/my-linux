# MyLinux Hyprland monitors
#
# Reasonable defaults; users override per-machine. The catch-all rule gives any
# unconfigured display a sensible resolution and 60 Hz refresh rate.

monitor = , preferred, auto, auto

# Example explicit configuration (uncomment and edit):
# monitor = DP-1, 2560x1440@165, 0x0, 1.0
# monitor = eDP-1, 1920x1080@60, 0x0, 1.25

workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
