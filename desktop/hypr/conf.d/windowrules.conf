# MyLinux Hyprland window rules
#
# Behaviour, floating and tiling rules for the MyLinux desktop. Rules are kept
# grouped by purpose so they are easy to audit.

# ---- XDG portals / dialogs should float -------------------------------
windowrulev2 = float, class:^(xdg-desktop-portal-.*)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(File Upload)$

# ---- authentication prompts ------------------------------------------
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = float, class:^(hyprpolkitagent)$

# ---- picture-in-picture ----------------------------------------------
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-490 100%-280, title:^(Picture-in-Picture)$

# ---- file managers / settings ----------------------------------------
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = float, class:^(qt6ct)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 900 600, class:^(blueman-manager)$

# ---- media players ----------------------------------------------------
windowrulev2 = tile, class:^(mpv)$
windowrulev2 = idleinhibit fullscreen, class:^(.*)$

# ---- suppress maximise to fullscreen noise ---------------------------
windowrulev2 = suppressevent maximize, class:^(.*)$
windowrulev2 = nofocus onworkspace 1, class:^(org.kde.polkit-kde-authentication-agent-1)$
