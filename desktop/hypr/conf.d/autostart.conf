# MyLinux Hyprland autostart
#
# Programs launched with the session. Order matters: the shell and portals come
# up first, then the desktop services and the wallpaper.

# ---- MyLinux shell ----------------------------------------------------
exec-once = quickshell -p ~/.config/quickshell/shell.qml

# ---- XDG portals ------------------------------------------------------
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal

# ---- authentication agent --------------------------------------------
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ---- desktop services ------------------------------------------------
exec-once = hypridle
exec-once = hyprpaper
exec-once = mako

# ---- clipboard history -----------------------------------------------
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ---- network / bluetooth applets -------------------------------------
exec-once = nm-applet --indicator
exec-once = blueman-applet
