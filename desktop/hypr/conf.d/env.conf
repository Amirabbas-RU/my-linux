# MyLinux Hyprland environment
#
# Wayland session variables. These are applied when Hyprland starts the
# session so that toolkits, portals and the shell pick the Wayland backends.

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt / Quickshell
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Toolkit backends
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# Cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Software rendering fallback for virtualised / GPU-less systems.
# Users with a real GPU can comment this line out for hardware acceleration.
env = LIBGL_ALWAYS_SOFTWARE,1
