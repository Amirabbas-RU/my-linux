# MyLinux Hyprland input
#
# Keyboard, mouse, touchpad and gesture behaviour. Keyboard layout defaults to
# us; the MyLinux installer rewrites this file's layout line per the user's
# selection at install time.

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    numlock_by_default = false
    repeat_delay = 300
    repeat_rate = 40

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 1.0
        tap-to-click = true
        clickfinger_behavior = false
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
