# MyLinux Hyprland entry configuration
#
# This file is intentionally thin: it sets source-root variables and then
# pulls in the modular configuration from conf.d/. Keeping the entry point
# small makes it easy for users to override a single concern without editing
# the whole compositor config.
#
# Installed path: ~/.config/hypr/hyprland.conf

$config = ~/.config/hypr
$scripts = ~/.config/hypr/scripts

# ---- modules ---------------------------------------------------------
source = $config/conf.d/env.conf
source = $config/conf.d/appearance.conf
source = $config/conf.d/animations.conf
source = $config/conf.d/input.conf
source = $config/conf.d/monitors.conf
source = $config/conf.d/windowrules.conf
source = $config/conf.d/autostart.conf
source = $config/conf.d/keybinds.conf
