# MyLinux Hyprlock lock screen
#
# Themed to match the MyLinux palette. Blurs the current screen, shows the
# clock, date, user and a password field.

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    contrast = 1.0
}

# ---- clock / date -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(f5a623ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(ece9f5ff)
    font_size = 20
    font_family = Noto Sans
    position = 0, 90
    halign = center
    valign = center
}

# ---- user avatar placeholder -----------------------------------------
label {
    monitor =
    text = "MyLinux"
    color = rgba(7c6cf0ff)
    font_size = 18
    font_family = Noto Sans
    position = 0, -160
    halign = center
    valign = center
}

# ---- password input ---------------------------------------------------
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgba(f5a623ff)
    inner_color = rgba(16131fff)
    font_color = rgba(ece9f5ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##b6afc9">Password…</span>
    position = 0, -110
    halign = center
    valign = center
}
